[project]
name = "retrocheevos"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<5.3",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "ruff>=0.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "retrocheevos.settings.dev"
python_files = ["tests.py", "test_*.py"]
