{% load i18n %}
<div>
  <h3 class="mb-3 mt-1 font-display text-[15px] font-semibold text-txt">{% trans "Event awards" %}</h3>
  <div class="mb-[22px] flex flex-col gap-2">
    {% for a in event_awards %}
      <div class="flex items-center gap-3 rounded-tile border border-line px-3 py-2.5">
        <div class="text-{{ a.tone }} flex h-10 w-10 shrink-0 items-center justify-center rounded-tile border border-current bg-elevated bg-[radial-gradient(circle_at_30%_30%,currentColor,transparent_75%)] font-display text-[11px] font-bold">{{ a.ini }}</div>
        <div class="min-w-0">
          <div class="font-display text-[13px] font-semibold text-txt">{{ a.name }}</div>
          <div class="font-mono text-[10px] text-txt-faint">{{ a.when }}</div>
        </div>
      </div>
    {% endfor %}
  </div>

  <h3 class="mb-2.5 mt-1 font-display text-[15px] font-semibold text-txt">{% trans "Platinums & game awards" %}</h3>
  <div class="flex gap-2 overflow-x-auto pb-2">
    {% for a in game_awards %}
      <div class="text-{{ a.tone }} rp-hatch flex h-[54px] w-[54px] shrink-0 items-center justify-center rounded-tile border-2 border-current font-display text-[11px] font-bold shadow-[0_0_12px_-3px_currentColor]">{{ a.ini }}</div>
    {% endfor %}
  </div>
</div>
