{% load i18n %}
<div>
  <h3 class="mb-3 mt-1 font-display text-[15px] font-semibold text-txt">{% trans "Recently played" %}</h3>
  <div class="flex flex-col gap-2.5">
    {% for g in recent_games %}
      {% include "components/game-card.html" with initials=g.initials title=g.title meta=g.meta state=g.state state_label=g.state_label pct=g.pct icons=g.grid_mobile.cells icons_more=g.grid_mobile.more %}
    {% endfor %}
  </div>
</div>
