{% load i18n %}
<div class="flex flex-col gap-8">
  {% include "accounts/partials/sec-stats.html" %}

  <section>
    {% include "components/section-heading.html" with title=_("Recent progress") %}
    <div class="mt-4 flex h-16 items-end gap-1">
      {% for b in heat %}
        <div class="flex-1 rounded-sm {% if b.on %}bg-brand{% else %}bg-elevated{% endif %}" style="height:{{ b.height_mobile }}px;opacity:{{ b.opacity }}"></div>
      {% endfor %}
    </div>
    <div class="mt-2 flex justify-between font-mono text-xs text-txt-faint">
      <span>{% trans "14d ago" %}</span>
      <span>{{ heat_rate }}</span>
      <span>{% trans "today" %}</span>
    </div>
  </section>
</div>
