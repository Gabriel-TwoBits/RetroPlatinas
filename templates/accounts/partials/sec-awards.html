{% load i18n %}
<section>
  {% include "components/section-heading.html" with title=_("Platinums & awards") accent="state-platinum" %}
  <div class="mt-3 grid grid-cols-5 gap-2">
    {% for a in game_awards %}
      <div class="text-{{ a.tone }} rp-hatch flex aspect-square items-center justify-center rounded-tile border-2 border-current font-display text-xs font-bold">{{ a.ini }}</div>
    {% endfor %}
    <div class="flex aspect-square items-center justify-center rounded-tile border border-dashed border-line2 font-mono text-xs text-txt-muted">+{{ game_awards_more }}</div>
  </div>
</section>
