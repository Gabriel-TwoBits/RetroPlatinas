{% load i18n %}
<div>
  <div class="mb-3 flex items-baseline justify-between">
    <h3 class="font-display text-[17px] font-semibold text-txt">{% trans "Recently played" %}</h3>
    <a href="#" class="font-mono text-[11px] text-brand">{% trans "see all →" %}</a>
  </div>
  <div class="flex flex-col gap-3">
    {% for g in recent_games %}
      <div class="rounded-card border border-line bg-surface p-4">
        <div class="flex gap-3.5">
          <div class="rp-hatch flex h-14 w-14 shrink-0 items-center justify-center rounded-tile border border-line2 font-display font-bold text-brand">{{ g.initials }}</div>
          <div class="min-w-0 flex-1">
            <div class="flex items-start justify-between gap-2.5">
              <div class="font-display text-base font-semibold text-txt">{{ g.title }}</div>
              <span class="whitespace-nowrap rounded-full border border-state-{{ g.state }} px-2 py-0.5 font-mono text-[9.5px] text-state-{{ g.state }}">{{ g.state_label }}</span>
            </div>
            <div class="mb-2.5 mt-1.5 font-mono text-[10.5px] text-txt-faint">{{ g.meta }}</div>
            <div class="flex items-center gap-2.5">
              <div class="h-1.5 flex-1 overflow-hidden rounded-full bg-elevated">
                <div class="h-full bg-state-{{ g.state }}" style="width:{{ g.pct }}%"></div>
              </div>
              <span class="font-mono text-[11px] text-txt-muted">{{ g.pct }}%</span>
            </div>
          </div>
        </div>
        <div class="mt-3.5 grid grid-cols-10 gap-1.5 sm:grid-cols-20">
          {% for c in g.grid.cells %}
            <div class="aspect-square rounded-chip {% if c.unlocked %}border border-gold/40 bg-gradient-to-br from-gold to-gold-deep{% else %}border border-line bg-surface2 opacity-45{% endif %}"></div>
          {% endfor %}
          {% if g.grid.more %}
            <div class="flex aspect-square items-center justify-center rounded-chip border border-line2 bg-surface2 font-mono text-[9px] text-brand">+{{ g.grid.more }}</div>
          {% endif %}
        </div>
      </div>
    {% endfor %}
  </div>
</div>
