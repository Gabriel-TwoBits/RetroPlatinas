{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Change password" %} — RetroPlatinas{% endblock %}

{% block content %}
<div class="mx-auto max-w-sm px-4 py-10">
  <h1 class="border-b border-line2 pb-3 font-display text-2xl font-bold text-txt">{% trans "Change password" %}</h1>
  <form method="post" class="rp-form mt-6">
    {% csrf_token %}
    {% include "components/form-fields.html" %}
    <button type="submit" class="mt-2 w-full rounded-tile bg-brand px-4 py-2.5 font-display text-sm font-bold text-brand-ink">{% trans "Change password" %}</button>
  </form>
</div>
{% endblock %}
