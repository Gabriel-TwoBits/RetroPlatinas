{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Log in" %} — RetroCheevos{% endblock %}

{% block content %}
<h1>{% trans "Log in" %}</h1>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">{% trans "Log in" %}</button>
</form>
<p>{% trans "No account yet?" %} <a href="{% url 'register' %}">{% trans "Register" %}</a></p>
{% endblock %}
