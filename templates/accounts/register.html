{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Register" %} — RetroPlatinas{% endblock %}

{% block content %}
<h1>{% trans "Create account" %}</h1>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">{% trans "Register" %}</button>
</form>
<p>{% trans "Already have an account?" %} <a href="{% url 'login' %}">{% trans "Log in" %}</a></p>
{% endblock %}
