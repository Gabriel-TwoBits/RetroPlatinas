{% comment %}
  Ruled section heading: accent strip + title over a hairline. Args:
    title  : heading text
    accent : colour token of the strip — brand (default) | gold | state-platinum | state-hardcore
{% endcomment %}
<h2 class="flex items-center gap-2 border-b border-line2 pb-2 font-display text-sm font-semibold text-txt">
  <span class="h-3 w-strip shrink-0 rounded-sm bg-{{ accent|default:'brand' }}"></span>{{ title }}
</h2>
